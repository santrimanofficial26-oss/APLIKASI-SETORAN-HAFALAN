<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PENA-Q - Aplikasi Setoran Hafalan Tahsin & Tahfidz</title>
    
    <!-- PWA & Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PENA-Q">
    <meta name="theme-color" content="#10b981">
    <meta name="description" content="Aplikasi Setoran Hafalan Qur'an (Tahsin & Tahfidz) SMP Pesantren Nahdlatul Wathon">

    <!-- Google Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">

    <!-- Vanilla CSS Styling -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #064e3b;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* Container Layout */
        #app-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        /* Main Iframe */
        #main-iframe {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            display: block;
            background-color: #f8fafc;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        #main-iframe.loaded {
            opacity: 1;
        }

        /* Splash Loading Screen */
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #064e3b 0%, #047857 50%, #10b981 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            color: #ffffff;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            padding: 24px;
            text-align: center;
        }

        #loading-screen.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        /* App Badge Icon */
        .app-badge-icon {
            width: 88px;
            height: 88px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            animation: pulse-badge 2s infinite ease-in-out;
        }

        .app-badge-icon span {
            font-size: 44px;
            color: #ffffff;
        }

        @keyframes pulse-badge {
            0%, 100% { transform: scale(1); box-shadow: 0 20px 40px rgba(0,0,0,0.25); }
            50% { transform: scale(1.05); box-shadow: 0 25px 50px rgba(16, 185, 129, 0.4); }
        }

        .app-title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .app-subtitle {
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 32px;
            max-width: 300px;
            line-height: 1.5;
        }

        /* Custom Spinner */
        .spinner-box {
            position: relative;
            width: 48px;
            height: 48px;
            margin-bottom: 16px;
        }

        .spinner-ring {
            width: 100%;
            height: 100%;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 12px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 0.5px;
        }

    </style>
</head>
<body>

    <div id="app-container">
        <!-- Loading Splash Screen -->
        <div id="loading-screen">
            <div class="app-badge-icon">
                <span class="material-icons-outlined">menu_book</span>
            </div>
            <h1 class="app-title">PENA-Q</h1>
            <p class="app-subtitle">Aplikasi Setoran Hafalan Tahsin & Tahfidz<br>SMP Pesantren Nahdlatul Wathon</p>
            
            <div class="spinner-box">
                <div class="spinner-ring"></div>
            </div>
            <p class="loading-text" id="loading-status">Menyiapkan Aplikasi...</p>
        </div>

        <!-- Embedded Google Apps Script Web App -->
        <iframe 
            id="main-iframe"
            src="https://script.google.com/macros/s/AKfycbxr53tjLnAZiuWiV9utRskjG6RV3bDFlbevYPgyhYtwrntqKOHwKjrek7BC0l4vR7NMug/exec"
            allow="geolocation; microphone; camera; clipboard-write;"
            sandbox="allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts allow-top-navigation-by-user-activation"
            title="PENA-Q Apps Script">
        </iframe>


    </div>

    <script>
        const iframe = document.getElementById('main-iframe');
        const loadingScreen = document.getElementById('loading-screen');
        const loadingStatus = document.getElementById('loading-status');

        let isLoaded = false;

        // When iframe finishes loading
        iframe.onload = function() {
            isLoaded = true;
            iframe.classList.add('loaded');
            loadingScreen.classList.add('fade-out');
            setTimeout(() => {
                loadingScreen.style.display = 'none';
            }, 500);
        };

        // Timeout Fallback: Hide splash after 6 seconds even if load event doesn't fire
        setTimeout(() => {
            if (!isLoaded) {
                loadingStatus.innerText = "Membuka Aplikasi...";
                iframe.classList.add('loaded');
                loadingScreen.classList.add('fade-out');
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                }, 500);
            }
        }, 6000);



        // Prevent Pull-to-Refresh default touch behaviors on mobile
        document.body.addEventListener('touchstart', function(e) {
            if (e.touches.length > 1) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
</html>
